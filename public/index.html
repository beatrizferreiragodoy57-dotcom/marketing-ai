<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="MARKETING IA ASSISTENTE — Inteligência Artificial para estratégias de marketing">

    <title>MARKETING IA ASSISTENTE</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">


    <!-- ==================================================
         CABEÇALHO
    ================================================== -->

    <header class="topo">

        <div class="marca">

            <div class="logo-ia">
                🤖
            </div>

            <div>

                <h1>
                    MARKETING IA ASSISTENTE
                </h1>

                <p>
                    Inteligência Artificial para criar estratégias de marketing
                </p>

            </div>

        </div>


        <div class="menu">

            <button id="novaConversa">
                ➕ Nova Conversa
            </button>

            <button id="exportarPDF">
                📄 Exportar PDF
            </button>

            <button id="limparHistorico">
                🗑️ Limpar Histórico
            </button>

            <button id="modoEscuro">
                🌙 Modo Escuro
            </button>

        </div>

    </header>



    <!-- ==================================================
         ÁREA PRINCIPAL
    ================================================== -->

    <main class="principal">


        <!-- ==================================================
             HISTÓRICO
        ================================================== -->

        <aside class="historico">

            <div class="historico-titulo">

                <span>💬</span>

                <strong>
                    Histórico
                </strong>

            </div>


            <button
                class="botao-historico"
                id="novaConversaLateral">

                ➕ Nova Conversa

            </button>


            <div
                id="listaHistorico"
                class="lista-historico">

            </div>

        </aside>



        <!-- ==================================================
             CHAT
        ================================================== -->

        <section class="area-chat">


            <!-- ==================================================
                 BARRA SUPERIOR DO CHAT
            ================================================== -->

            <div class="barra-chat">

                <div>

                    <strong>
                        🤖 Assistente de Marketing
                    </strong>

                    <span>
                        ● Online
                    </span>

                </div>

                <small>
                    Especialista em estratégias de marketing
                </small>

            </div>



            <!-- ==================================================
                 MENSAGENS
            ================================================== -->

            <div id="chat"></div>



            <!-- ==================================================
                 ATALHOS
            ================================================== -->

            <div class="atalhos-titulo">
                <span>✨</span>
                <strong>Comece rapidamente</strong>
            </div>


            <div class="atalhos">

                <button
                    class="atalho"
                    data-tipo="swot">

                    <span>📊</span>

                    <div>
                        <strong>Análise SWOT</strong>
                        <small>Analise seu negócio</small>
                    </div>

                </button>


                <button
                    class="atalho"
                    data-tipo="persona">

                    <span>👤</span>

                    <div>
                        <strong>Criar Persona</strong>
                        <small>Conheça seu cliente</small>
                    </div>

                </button>


                <button
                    class="atalho"
                    data-tipo="plano">

                    <span>📈</span>

                    <div>
                        <strong>Plano de Marketing</strong>
                        <small>Crie sua estratégia</small>
                    </div>

                </button>


                <button
                    class="atalho"
                    data-tipo="redes">

                    <span>📱</span>

                    <div>
                        <strong>Redes Sociais</strong>
                        <small>Planeje seus conteúdos</small>
                    </div>

                </button>


                <button
                    class="atalho"
                    data-tipo="calendario">

                    <span>📅</span>

                    <div>
                        <strong>Calendário</strong>
                        <small>30 dias de conteúdo</small>
                    </div>

                </button>


                <button
                    class="atalho"
                    data-tipo="campanha">

                    <span>🎯</span>

                    <div>
                        <strong>Campanha</strong>
                        <small>Crie uma campanha</small>
                    </div>

                </button>

            </div>



            <!-- ==================================================
                 CAMPO DE MENSAGEM
            ================================================== -->

            <div class="input-area">

                <div class="campo-mensagem">

                    <textarea
                        id="mensagem"
                        rows="1"
                        autocomplete="off"
                        placeholder="Digite sua pergunta sobre marketing..."></textarea>

                    <small>
                        Enter para enviar • Shift + Enter para nova linha
                    </small>

                </div>


                <button id="enviar">

                    <span class="texto-enviar">
                        Enviar
                    </span>

                    <span class="icone-enviar">
                        ➤
                    </span>

                </button>

            </div>

        </section>

    </main>

</div>



<!-- ==================================================
     BIBLIOTECA PDF
================================================== -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>


<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script src="script.js"></script>

</body>

</html>
